# VibeLog di belakang reverse proxy (contoh nginx)
#
# Container VibeLog mendengarkan di 127.0.0.1:8090 dan sudah melayani
# frontend + API dari port yang sama. nginx hanya menangani TLS dan
# meneruskan semuanya.
#
# Ganti vibelog.example.com dengan domain sebenarnya, lalu aktifkan HTTPS
# (certbot) sebelum instance dipakai publik.
#
# Saat memakai proxy ini, set di .env:
#   BASE_URL=https://vibelog.example.com
#   TRUSTED_PROXIES=172.16.0.0/12   # atau IP container/loopback proxy

server {
    listen 80;
    server_name vibelog.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vibelog.example.com;

    # ssl_certificate     /etc/letsencrypt/live/vibelog.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vibelog.example.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
