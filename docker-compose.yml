services:
  vibelog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    environment:
      APP_ENV: production
      BASE_URL: ${BASE_URL:-http://localhost:8090}
      DATABASE_PATH: /data/vibelog.db
      # Kosong = secret dibuat otomatis di volume /data. Isi hanya bila ingin
      # memakai secret sendiri (minimal 32 karakter).
      JWT_SECRET: ${JWT_SECRET:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-VibeLog <no-reply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "${PORT:-8090}:8080"
    volumes:
      - vibelog-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  vibelog-data:
