services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/vibelog.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET harus diisi di .env}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL harus diisi di .env}
    volumes:
      - vibelog-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vibelog-data:
